
name: Build Naruto Shinobi Craft

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract mod source
        run: |
          mkdir projeto
          unzip -q NarutoShinobiCraft_1.20.1_Fabric_Source.zip -d projeto

      - name: Fix Gradle repository conflict
        run: |
          settings_file="$(find projeto -name settings.gradle -print -quit)"
          test -n "$settings_file"
          sed -i '/repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)/d' "$settings_file"
          
      - name: Build mod
        run: |
          cd projeto
          gradle_file="$(find . -name build.gradle -print -quit)"
          test -n "$gradle_file"
          cd "$(dirname "$gradle_file")"
          gradle build --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NarutoShinobiCraft-JAR
          path: projeto/**/*.jar
          if-no-files-found: error
          
