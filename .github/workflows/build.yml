
name: Build Naruto Shinobi Craft

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract mod source
        run: |
          mkdir projeto
          unzip -q NarutoShinobiCraft_1.20.1_Fabric_Source.zip -d projeto

      - name: Build mod
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          cd projeto
          gradle_file="$(find . -name build.gradle -print -quit)"
          test -n "$gradle_file"
          cd "$(dirname "$gradle_file")"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NarutoShinobiCraft-JAR
          path: projeto/**/*.jar
          
